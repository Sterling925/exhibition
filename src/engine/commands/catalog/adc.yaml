# Command catalog for ADC channel handlers.
kind: adc
cpp_enum: AdcCmd
commands:
  # Universal command (opcode 0x00, reserved protocol-wide): the RemoteTerminal
  # answers this sub-address's per-service API hash framework-side.
  - name: GET_SERVICE_HASH
    opcode: "0x00"
    description: Get the per-service API hash
    cmd_payload:
      bytes: "0"
    resp_payload:
      bytes: "4"
      fields:
        - service_hash: uint32_t
  - name: SAMPLE
    opcode: "0x01"
    description: Sample the ADC channel
    cmd_payload:
      bytes: "0"
    resp_payload:
      bytes: "6"
      fields:
        - counts: uint16_t
        - bc_timestamp: uint32_t
