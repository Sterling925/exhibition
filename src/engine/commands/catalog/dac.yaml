# Command catalog for DAC channel handlers.
kind: dac
cpp_enum: DacCmd
commands:
  # Universal command (opcode 0x00, reserved protocol-wide): the RemoteTerminal
  # answers this sub-address's per-service API hash framework-side.
  - name: GET_SERVICE_HASH
    opcode: "0x00"
    description: Get the per-service API hash
    cmd_payload:
      bytes: "0"
    resp_payload:
      bytes: "4"
      fields:
        - service_hash: uint32_t
  - name: SET_COUNTS
    opcode: "0x01"
    description: Set the DAC output (raw counts)
    cmd_payload:
      bytes: "2"
      fields:
        - counts: uint16_t
    resp_payload:
      bytes: "0"
