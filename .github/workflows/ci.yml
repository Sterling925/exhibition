name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, build, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # fmt and clippy are advisory: they report issues but do not fail CI,
      # since the tree is hand-formatted and not enforced against rustfmt.
      - name: Format check (advisory)
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: Clippy (advisory)
        continue-on-error: true
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --release

      - name: Test
        run: cargo test

  cpp-tests:
    name: C++ unit tests (Catch2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure C++ tests
        run: cmake -S src/engine/autogen_content/cpp/tests -B build -G Ninja

      - name: Build C++ tests
        run: cmake --build build

      - name: Run C++ tests
        run: ctest --test-dir build --output-on-failure
